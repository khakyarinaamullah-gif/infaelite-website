# Builds the site with build.py and publishes dist/ to GitHub Pages on every push to main.
# Repository settings: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund

      # Reads the address GitHub Pages serves this site at: the custom domain once one is set,
      # the github.io project address until then. The build writes it into canonical URLs and the sitemap.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py dist

      - name: Check the build
        run: |
          test -f dist/index.html
          test -f dist/shopify-development/index.html
          test -f dist/shopify-store-redesign/index.html
          test -f dist/wordpress-development/index.html
          test -f dist/privacy-policy/index.html
          test -f dist/404.html
          test -f dist/assets/vendor.js
          test -f dist/sitemap.xml
          ! grep -rl '{{' dist --include=*.html --include=*.css --include=*.js --include=*.txt

      # Compares the new pages with the live ones; only added or changed pages go to IndexNow after the deploy.
      - name: Pages changed since the live version
        id: indexnow
        run: |
          if [ -f tools/indexnow.py ]; then echo "payload=$(python tools/indexnow.py dist)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow (Bing and other engines): submits only the pages listed by the build job. A failure here
      # is reported but does not undo the deployment.
      - name: Notify IndexNow of changed pages
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          echo "$PAYLOAD"
          sleep 20
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$PAYLOAD")
          echo "IndexNow answered HTTP $code"; cat /tmp/indexnow.out || true
          test "$code" = 200 || test "$code" = 202
